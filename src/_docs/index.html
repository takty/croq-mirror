<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width,initial-scale=1">
	<title>croq-mirror - standalone example</title>
	<link rel="stylesheet" href="/croq-mirror.min.css">
	<link rel="stylesheet" href="./style.css">
</head>

<body>
	<h1>croq-mirror</h1>
	<p>Try the editor using the controls below. These controls belong to this example, not to the editor component.</p>
	<main>
		<fieldset id="language">
			<legend>Component language</legend>
			<label><input type="radio" name="language" value="en" checked> English</label>
			<label><input type="radio" name="language" value="ja"> Japanese</label>
		</fieldset>
		<fieldset id="code-language">
			<legend>Source language</legend>
			<label><input type="radio" name="code-language" value="javascript" checked> JavaScript</label>
			<label><input type="radio" name="code-language" value="java"> Java</label>
		</fieldset>
		<fieldset id="extensions">
			<legend>Editor extensions</legend>
			<label><input type="checkbox" name="structureHighlight" checked> Structure highlighting</label>
			<label><input type="checkbox" name="declarationHighlight" checked> Declaration highlighting</label>
			<label><input type="checkbox" name="syntaxHighlight" checked> Syntax highlighting</label>
			<label><input type="checkbox" name="semanticHighlight" checked> Semantic highlighting</label>
			<label><input type="checkbox" name="functionLineNumbers" checked> Per-function line numbers</label>
			<label><input type="checkbox" name="functionScrollMarkers"> Function scroll markers</label>
			<label><input type="checkbox" name="bracketMatching" checked> Bracket matching</label>
			<label><input type="checkbox" name="closeBrackets" checked> Automatically close brackets and quotes</label>
			<label><input type="checkbox" name="closeBraces"> Include curly braces</label>
			<label><input type="checkbox" name="easyLineSelection"> Easy line selection</label>
			<label><input type="checkbox" name="rulers" checked> Indentation guides</label>
		</fieldset>
		<div id="editor" class="container"></div>
		<button id="undo">Undo</button>
		<button id="paste">Paste</button>
		<button id="format">Format</button>
		<button id="analysis">Analysis</button>
		<button id="readonly">Read-only</button>
		<button id="disabled">Disable interaction</button>
		<button id="recreate">Destroy and recreate</button>
	</main>
	<pre id="status" aria-live="polite">Loading...</pre>
	<script type="module" src="./main.js"></script>
</body>

</html>
